onboarding = false
# Herdr configuration
#
# Keybindings converted from home/dot-tmux.conf. Each converted binding keeps
# its original tmux line in a comment above it. See the "Not ported" notes at
# the bottom of this file for the tmux features that have no herdr equivalent.

[theme]
# tmux used a Material Palenight-ish palette. herdr has no status-line format
# string, so only the accent colors carry over.
# name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#82aaff" # was: @prefix_highlight_fg / status-left session badge bg
yellow = "#ffcb6b" # was: @prefix_highlight_copy_mode_attr fg

[keys]
# was: set -g prefix C-t   /   unbind C-b
prefix = "ctrl+t"

# was: bind -n S-C-n next-window   /   bind -n S-C-p previous-window
# A tmux "window" is a herdr "tab". An action accepts a list of bindings, so
# all three forms work: the tmux ones, the prefix+C-n/C-p muscle memory, and
# herdr's own prefix+n/prefix+p defaults (setting this key at all would
# otherwise replace them).
next_tab = ["ctrl+shift+n", "prefix+ctrl+n", "prefix+n"]
previous_tab = ["ctrl+shift+p", "prefix+ctrl+p", "prefix+p"]

# was: bind Enter copy-mode
copy_mode = "prefix+enter"

# ---------------------------------------------------------------------------
# Agent and workspace navigation
# ---------------------------------------------------------------------------
#
# No tmux ancestry here — tmux had no concept of an agent. These are herdr
# built-ins that ship unset, which is why switching between agents used to mean
# reaching for the mouse.
#
# The pattern extends the pane keys one level up: prefix+h/j/k/l moves between
# panes, prefix+shift+ the same letters moves between the bigger units. j/k
# walks agents; h/l crosses between the planning and implementation halves of a
# ticket (the [[keys.command]] pair at the bottom of this file).
#
# Deliberately left unbound: next_workspace/previous_workspace (the prefix+w
# picker and switch_workspace below cover it, and shift+h/l is spoken for) and
# remove_worktree (destructive — the CLI is a better home for it).

# Cycle agents in agent-panel order, which ui.agent_panel_sort sets to
# "spaces" — grouped by workspace, so an agent keeps a stable position.
# Switch that to "priority" to walk an attention queue instead.
#
# Two forms, same as next_tab: shift+j/k is the one that matches the pane keys,
# and ctrl+shift+j/k is the one you can roll into without lifting ctrl off the
# prefix. Keep both — an action takes a list.
next_agent = ["prefix+shift+j", "prefix+ctrl+shift+j"]
previous_agent = ["prefix+shift+k", "prefix+ctrl+shift+k"]

# Jump straight to an agent row or a workspace by index.
# NOTE: alt is the least reliable modifier across terminals. If prefix+alt+1
# does nothing, this is the first line to suspect.
focus_agent = "prefix+alt+1..9"
switch_workspace = "prefix+shift+1..9"

# Back to wherever you just were, across workspaces and tabs. ctrl+o is vim's
# jump-back. prefix+ctrl+t — the tmux double-tap-the-prefix spot — is taken by
# the send-prefix binding below.
last_pane = "prefix+ctrl+o"

# Reopen a worktree that exists on disk but has no workspace. Joins the g
# family: prefix+g goto, prefix+shift+g new worktree, prefix+ctrl+g open one.
open_worktree = "prefix+ctrl+g"

# focus_pane_left/down/up/right intentionally keep their herdr defaults
# (prefix+h/j/k/l) as a plain, always-works fallback. The vim-aware ctrl+hjkl
# bindings you had in tmux are the [[keys.command]] entries below.

# was: bind -n C-h run-shell 'neovim-tmux-navigator client -L'
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "herdr-nvim-nav left"
description = "Focus pane left (vim-aware)"

# was: bind -n C-j run-shell 'neovim-tmux-navigator client -D'
[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "herdr-nvim-nav down"
description = "Focus pane down (vim-aware)"

# was: bind -n C-k run-shell 'neovim-tmux-navigator client -U'
[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "herdr-nvim-nav up"
description = "Focus pane up (vim-aware)"

# was: bind -n C-l run-shell 'neovim-tmux-navigator client -R'
# NOTE: this takes ctrl+l away from the shell entirely — at the rightmost pane
# it zooms rather than clearing. Use prefix+ctrl+l (below) to clear.
[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "herdr-nvim-nav right"
description = "Focus pane right (vim-aware)"

# was: bind-key ^l send-keys C-l
# Gives clear-screen back, now that ctrl+l is the pane-right binding. herdr has
# no send-keys action, so this goes through the CLI.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "herdr-send-key ctrl+l"
description = "Send ctrl+l to the pane (clear screen)"

# herdr-spreader's layout apply. Plugin actions never surface in a menu, so a
# keybinding (or `herdr plugin action invoke`) is the only way to trigger one.
# prefix+a is unused by herdr's defaults and by everything above.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-spreader.apply"
description = "Apply layout"

# The h/l half of the shift+hjkl scheme: cross between the two halves of a
# handoff-implementation handoff. Left goes back to the planning tab in the
# source checkout, right goes out to the implementation worktree workspace.
# Correlated by the ENG-NNNN ticket id; see herdr-ticket-jump for how.
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "herdr-ticket-jump plan"
description = "Jump to this ticket's planning tab"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr-ticket-jump impl"
description = "Jump to this ticket's implementation worktree"

# Pull each worktree back under the checkout it came from. Workspace order is
# creation order and worktrees are created last, so they drift to the bottom,
# away from their source — and since the agent panel groups by space in
# workspace order, they drift in the sidebar too. prefix+ctrl+w is free;
# prefix+w is the workspace picker and prefix+shift+w renames.
#
# handoff-implementation also calls this after creating a worktree, so this
# binding is for the drift that accumulates the rest of the time.
[[keys.command]]
key = "prefix+ctrl+w"
type = "shell"
command = "herdr-group-worktrees"
description = "Group worktree workspaces under their source"

[ui]
# was: @prefix_highlight_fg '#82aaff'
accent = "#82aaff"

show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
# tab_bar_position = "bottom"

# Sidebar rows are the one place herdr renders arbitrary command output: a row
# can contain a $token, and tokens are pushed in over the CLI. This replaces
# the pomo half of tmux's status-right.
#
# $pomo is fed by herdr-pomo-status, which pomo-event calls on every state or
# remaining-minute change. It tags only the "Pomodoro" space, so $pomo is empty
# everywhere else — it shares the branch/git_status row rather than taking one
# of its own so that empty case costs no vertical space.
#
# Built-in space tokens: state_icon, state_text, workspace, branch, git_status.
# A token can be styled: { token = "$pomo", fg = "#82aaff" }.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status", "$pomo"]]

[ui.toast]
# Agent done/blocked alerts arrive as macOS notifications, and that is the
# point of this setting — they need to reach you when herdr is not on screen.
#
# Known gap, deliberately accepted: a `herdr notification show` fired from the
# *focused* workspace does not render on this path. The dispatch succeeds
# (shown: true), it just never appears — consistent with this being, per the
# default config, "background notification popup delivery". Which is exactly
# the case a keybinding hits, since you are by definition looking at the
# workspace you pressed the key in.
#
# delivery is one global switch and there is no per-class override —
# NotificationShowParams takes only title, body, sound, and position, and
# position does not force the in-app renderer. So "herdr" would fix
# herdr-ticket-jump's toast at the cost of moving agent alerts in-app. Not
# worth it: herdr-ticket-jump signals with sound instead.
delivery = "system"


[experimental]
pane_history = true

# ---------------------------------------------------------------------------
# Not ported from .tmux.conf
# ---------------------------------------------------------------------------
#
# Plugins (tpm, tmux-sensible, tmux-pain-control, tmux-prefix-highlight,
#   tmux-yank, tmux-fingers, extrakto)
#   herdr has its own plugin system (herdr-plugin.toml manifests), but none of
#   these exist for it. No built-in equivalent for fingers/extrakto-style
#   copy-mode text grabbing.
#
# Status line (status-left/right, colours, status-interval, visual-bell,
#   monitor-activity, set-titles)
#   herdr renders a sidebar, not a formattable status line, and it never runs
#   a command for you. But sidebar rows do render $tokens that you push in via
#   `herdr workspace report-metadata`, so a poller can put pomo-tmux-status
#   output there. See the [ui.sidebar.spaces] notes above.
#
# bind t / C-M-t send-prefix
#   Nothing to port: herdr does this natively. Pressing the prefix twice sends
#   a literal prefix key, so ctrl+t ctrl+t already gets a ctrl+t through. The
#   key is reserved for it — binding prefix+ctrl+t to anything else reloads
#   with a "reserved keybinding" diagnostic and the binding is dropped.
#
# bind -n S-Enter send-keys Escape "[13;2u"
#   Terminal-level shift+enter encoding hack; herdr handles its own key
#   encoding.
#
# copy-mode-vi bindings (v begin-selection, y copy-selection, r rectangle)
#   herdr's copy mode has fixed bindings; only the key that enters it
#   (copy_mode, above) is configurable.
#
# bind-key S choose-tree -ZGs  /  bind-key s <grouped-session switcher>
#   herdr has no grouped-session concept, so tmux-double-switcher has nothing
#   to drive. The nearest thing is the workspace picker, left on its herdr
#   default of prefix+w (settings stays on prefix+s).
#
# bind-key p <pomodoro if-shell chain>
#   Deliberately skipped for now. prefix+p remains previous_tab.
#
# base-index / pane-base-index / main-pane-height / mode-keys vi
#   No herdr equivalents. Navigate mode already uses h/j/k/l.
#
# default-terminal, terminal-features RGB, xterm-keys
#   herdr manages its own terminal capabilities.
#
# set-environment -gu RBENV_VERSION
#   No config equivalent; unset it from your shell rc if still needed.
#
# mouse / WheelUpPane / WheelDownPane
#   Skipped per request. FWIW herdr already defaults to mouse_capture = true
#   and copy_on_select = true, which covers `set -g mouse on` and
#   `set-clipboard on`.
